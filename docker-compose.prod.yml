# Everything on one small server:
#   cp .env.prod.example .env.prod   # fill in JWT_SECRET and POSTGRES_PASSWORD
#   docker compose -f docker-compose.prod.yml --env-file .env.prod up -d --build
# Put HTTPS in front of port 4000 (Caddy, nginx, or your host's proxy).
services:
  app:
    build: .
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
    environment:
      DATABASE_URL: postgresql://olw:${POSTGRES_PASSWORD}@postgres:5432/our_little_world
      JWT_SECRET: ${JWT_SECRET}
      COOKIE_SECURE: ${COOKIE_SECURE:-true}
      ENABLED_FEATURES: ${ENABLED_FEATURES:-chat,movie}
      RELATIONSHIP: ${RELATIONSHIP:-friends}
      REDIS_URL: redis://redis:6379
      TURN_URLS: ${TURN_URLS:-}
      TURN_USERNAME: ${TURN_USERNAME:-}
      TURN_CREDENTIAL: ${TURN_CREDENTIAL:-}
    ports: ['${PORT:-4000}:4000']
    volumes: [uploads:/data/uploads]
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: olw
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: our_little_world
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U olw -d our_little_world']
      interval: 5s
      timeout: 5s
      retries: 10
  redis:
    image: redis:7-alpine
    restart: unless-stopped
volumes:
  pgdata:
  uploads:
