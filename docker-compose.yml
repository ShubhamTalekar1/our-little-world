# Local infrastructure for the real backend (not needed for demo mode).
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: olw
      POSTGRES_PASSWORD: olw
      POSTGRES_DB: our_little_world
    ports: ['5432:5432']
    volumes: [pgdata:/var/lib/postgresql/data]
  redis:
    image: redis:7-alpine
    ports: ['6379:6379']
volumes:
  pgdata:
